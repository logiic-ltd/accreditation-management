<div class="form-section" id="section2" style="display:none;">
    <div class="form-group">
        <label for="typeOfRequest" class="font-weight-bold">Type of Request</label>
        <select class="form-control form-control-lg" id="typeOfRequest" name="type_of_request" required>
            <option value="" disabled selected>Select Request Type</option>
            <option value="TVET Trade">TVET Trade</option>
            <option value="Combinations">General Combinations</option>
            <option value="Professional">Professional Combinations</option>
            <option value="Ordinary Level">Ordinary Level</option>
            <option value="Primary Level">Primary Level</option>
            <option value="Pre-primary Level">Pre-primary Level</option>
            <option value="Boarding Status">Boarding Status</option>
        </select>
    </div>

    <div id="combinationsSelectionSection" class="mb-4" style="display: none;">
        <div class="row">
            <div class="col-md-4">
                <div class="sector-selection">
                    <h4 class="font-weight-bold">Select Category</h4>
                    <p class="text-muted">Click on a category to view available combinations</p>
                    <div id="categoryGrid" class="sector-list">
                        <!-- Categories will be dynamically populated here -->
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="trades-content">
                    <div class="trades-filters">
                        <input type="text" class="form-control combination-search" placeholder="Search combinations...">
                        <div class="mt-3">
                            <button class="btn btn-sm btn-outline-primary" id="selectAllCombinations">Select All</button>
                            <button class="btn btn-sm btn-outline-secondary" id="clearAllCombinations">Clear All</button>
                        </div>
                    </div>
                    <div id="combinationsContainer" class="trades-container">
                        <!-- Combinations will be dynamically populated here -->
                    </div>
                    <div class="selection-summary d-flex justify-content-between align-items-center">
                        <div>
                            <span id="selectedCombinationsCount" class="badge badge-primary">0 selected</span>
                            <span class="text-muted ml-2">combinations selected</span>
                        </div>
                        <button class="btn btn-primary btn-sm" id="saveCombinationSelection">Save Selection</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="tvetSelectionSection" class="mb-4" style="display: none;">
        <div class="row">
            <div class="col-md-4">
                <div class="sector-selection card">
                    <div class="card-header">
                        <h4 class="font-weight-bold">Select TVET Sector</h4>
                        <p class="text-muted">Click on a sector to view available trades</p>
                    </div>
                    <div class="card-body" id="sectorGrid">
                        <!-- Sectors will be dynamically populated here -->
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="trades-content card">
                    <div class="card-header">
                        <div class="trades-filters">
                            <input type="text" class="form-control trade-search" placeholder="Search trades...">
                            <div class="mt-3">
                                <button class="btn btn-sm btn-outline-primary" id="selectAllTrades">Select All</button>
                                <button class="btn btn-sm btn-outline-secondary" id="clearAllTrades">Clear All</button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body" id="tradesContainer">
                        <!-- Trades will be dynamically populated here -->
                    </div>
                    <div class="card-footer selection-summary d-flex justify-content-between align-items-center">
                        <div>
                            <span id="selectedTradesCount" class="badge badge-primary">0 selected</span>
                            <span class="text-muted ml-2">trades selected</span>
                        </div>
                        <button class="btn btn-primary btn-sm" id="saveTradeSelection">Save Selection</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="form-group mt-4">
        <label for="otherRequest" class="font-weight-bold">Other Request (Specify)</label>
        <textarea class="form-control" id="otherRequest" name="other_request" rows="3"></textarea>
    </div>
</div>
