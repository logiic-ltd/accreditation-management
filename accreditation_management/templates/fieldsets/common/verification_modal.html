<div class="modal fade" id="verificationModal" tabindex="-1" role="dialog" aria-labelledby="verificationModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
        <div class="modal-content rounded-lg shadow">
            <div class="modal-body p-4">
                <button type="button" class="close position-absolute" data-dismiss="modal" aria-label="Close" style="right: 1rem; top: 1rem;">
                    <span aria-hidden="true">&times;</span>
                </button>
                <div class="text-center">
                    <div class="mb-4">
                        <i class="fa fa-envelope fa-3x text-primary"></i>
                    </div>
                    <h4 class="mb-3">Email Verification</h4>
                    <p class="text-muted">Enter the 6-digit code sent to <strong id="verificationEmailDisplay"></strong></p>
                </div>
                <div class="d-flex justify-content-center mb-4">
                    <input type="text" class="code-input form-control text-center mx-1 h4" maxlength="1">
                    <input type="text" class="code-input form-control text-center mx-1 h4" maxlength="1">
                    <input type="text" class="code-input form-control text-center mx-1 h4" maxlength="1">
                    <input type="text" class="code-input form-control text-center mx-1 h4" maxlength="1">
                    <input type="text" class="code-input form-control text-center mx-1 h4" maxlength="1">
                    <input type="text" class="code-input form-control text-center mx-1 h4" maxlength="1">
                </div>
                <input type="hidden" id="verificationCode">
                <button type="button" class="btn btn-primary btn-block mb-3" id="verifyCodeBtn">
                    <span class="verify-text">Verify Code</span>
                    <div class="verification-loader d-none">
                        <i class="fa fa-spinner fa-spin"></i>
                    </div>
                </button>
                <div class="text-center">
                    <small class="text-muted">Didn't receive the code? 
                        <button type="button" class="btn btn-link p-0 text-primary" id="resendCodeBtn">Resend</button>
                    </small>
                </div>
                <div class="verification-feedback mt-3 d-none">
                    <div class="alert alert-dismissible fade show" role="alert">
                        <i class="fa mr-2"></i>
                        <span class="feedback-message"></span>
                        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
